name: Build STP Dimension Tool EXE

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖与 PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install cadquery-ocp openpyxl pyinstaller

      - name: 打包生成独立 EXE
        run: |
          pyinstaller --noconfirm --onefile --console --name "STP长宽高统计工具" --collect-all OCP batch_stp_bbox.py

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: STP长宽高统计工具_EXE
          path: dist/STP长宽高统计工具.exe
